# ============================================================================
# TuberIA - production overlay (small VPS, Caddy terminating TLS)
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait
#
# Images are BUILT IN CI and PULLED here. There is deliberately no `build:`
# key: a `vite build` plus `pnpm install` on a 2 GB box competes for RAM with
# mongod and reliably gets it OOM-killed mid-deploy.
#
# Docker secrets are gone by design. All application configuration comes from
# a single env file (backend/.env) with 0600 permissions on the VPS.
# ============================================================================

name: tuberia

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

# Applied to every service. Together these mean: the container cannot write
# anywhere except its declared volumes and tmpfs, holds no Linux capabilities,
# and cannot gain new privileges through a setuid binary.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:

  # --------------------------------------------------------------------------
  # Caddy - the ONLY service permitted to bind a public address
  # --------------------------------------------------------------------------
  caddy:
    <<: *hardened
    image: caddy:2.11-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    logging: *logging
    # The single capability needed to bind ports below 1024. Everything else
    # stays dropped.
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"      # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # Let's Encrypt certificates + ACME account
      - caddy_config:/config
      # No ./logs/caddy bind mount: `cap_drop: ALL` strips CAP_DAC_OVERRIDE,
      # so root inside the container cannot write to a host directory owned by
      # another uid, and Caddy crash-loops on "permission denied". Access logs
      # go to stdout instead and are rotated by the json-file driver.
    tmpfs:
      # The only writable path once the root filesystem is read-only. noexec
      # stops an attacker dropping a binary here and running it; the size cap
      # stops a runaway filling host RAM, since tmpfs is RAM-backed.
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?DOMAIN_NAME must be set in .env}
      SSL_EMAIL: ${SSL_EMAIL:?SSL_EMAIL must be set in .env}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    healthcheck:
      # Probes CADDY, not the backend. The previous version proxied to
      # backend:5000/api/health, which marked the TLS terminator unhealthy
      # whenever the app was down - precisely when the proxy must stay up to
      # return a clean 502 - and never checked Caddy's own config or listener.
      # :2021/healthz is an internal-only site block in the Caddyfile; the
      # mutable admin API stays disabled.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2021/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.5
    pids_limit: 100

  # --------------------------------------------------------------------------
  # Frontend - static bundle behind nginx
  # --------------------------------------------------------------------------
  frontend:
    <<: *hardened
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER must be set in .env}/tuberia-frontend:${IMAGE_TAG:?IMAGE_TAG must be set in .env}
    pull_policy: always
    # Removes the base file's `build:` entirely, so a missing image fails fast
    # instead of silently starting a build on the VPS.
    build: !reset null
    restart: unless-stopped
    logging: *logging
    # No ports and no `expose:` - on a user-defined bridge network every
    # container port is already reachable between containers, which makes
    # `expose:` pure documentation. Caddy reaches this as frontend:8080.
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
      - /var/cache/nginx:size=16m,noexec,nosuid,nodev
    healthcheck:
      # busybox wget, present in the nginx-alpine image. Declared here rather
      # than in the base file because the dev frontend is Node running Vite and
      # has no wget. Without it, `up --wait` would report the frontend ready as
      # soon as the container started, even with an empty document root.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    # 64 MB, not the previous 256 MB: nginx serving static files idles around
    # 10 MB, and over-reserving is what starves mongod on a 2 GB host.
    mem_limit: 64m
    mem_reservation: 24m
    cpus: 0.25
    pids_limit: 100

  # --------------------------------------------------------------------------
  # Backend
  # --------------------------------------------------------------------------
  backend:
    <<: *hardened
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER must be set in .env}/tuberia-backend:${IMAGE_TAG:?IMAGE_TAG must be set in .env}
    pull_policy: always
    build: !reset null
    restart: unless-stopped
    logging: *logging
    init: true
    stop_grace_period: 30s
    user: "1000:1000"           # the `node` user baked into the image
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      # Winston writes files here. A tmpfs rather than a volume because the
      # same lines already go to stdout, and therefore to the json-file log.
      #
      # uid/gid are NOT optional: a tmpfs is created root-owned, so with
      # mode=0755 the container's `node` user (1000) could not write to it and
      # every winston file transport would fail silently.
      - /app/logs:size=32m,mode=0755,uid=1000,gid=1000,noexec,nosuid,nodev
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      # Nothing credential-bearing belongs here: `environment:` values show up
      # in `docker inspect`, `docker compose config` and CI logs. The old
      # inline MONGODB_URI with embedded credentials has been deleted - it now
      # lives in backend/.env alongside the other secrets.
      NODE_ENV: production
      PORT: "5000"
      # Cap V8's heap below the cgroup limit, leaving room for native
      # allocations (cheerio, the Sentry profiler, ArrayBuffers).
      NODE_OPTIONS: "--enable-source-maps --max-old-space-size=384"
    networks:
      # `!override`, NOT a plain list. Compose UNIONS `networks:` across
      # overlay files instead of replacing them - that is exactly how mongo and
      # redis previously ended up reachable on the public bridge in production
      # despite this file naming only the internal network. Verify with:
      #   docker compose -f docker-compose.yml -f docker-compose.prod.yml config
      !override
      - default            # reachable by Caddy
      - backend-internal   # reaches mongo + redis
    mem_limit: 512m
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256

  # --------------------------------------------------------------------------
  # MongoDB - internal network only, never published
  # --------------------------------------------------------------------------
  mongo:
    <<: *hardened
    restart: unless-stopped
    user: "999:999"             # uid=999(mongodb) gid=999(mongodb)
    volumes:
      # `!override` replaces the base list rather than extending it. The names
      # keep their `_prod` suffix because those volumes already hold live data
      # on the VPS - renaming a volume silently creates a new empty one.
      # Confirm with `docker volume ls | grep tuberia` before first deploy.
      !override
      - mongo_data_prod:/data/db
      - mongo_config_prod:/data/configdb
      - ./mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      # No ./mongo-backups bind mount. mongod runs as uid 999 with cap_drop:
      # ALL, so it has neither ownership of a host directory created by the
      # deploy user nor CAP_DAC_OVERRIDE to bypass the check - `mongodump
      # --out /backups` would fail with EACCES. Backups instead stream the
      # archive to the host over stdout, which needs no writable mount at all:
      #   docker compose ... exec -T mongo mongodump --archive ... > dump.gz
      # See scripts/backup-mongo.sh.
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev      # mongod's unix socket
    networks: !override [backend-internal]
    mem_limit: 640m
    mem_reservation: 384m
    cpus: 1.0
    pids_limit: 200

  # --------------------------------------------------------------------------
  # Redis - internal network only, never published
  # --------------------------------------------------------------------------
  redis:
    <<: *hardened
    restart: unless-stopped
    user: "999:1000"            # uid=999(redis) gid=1000(redis)
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --maxmemory
      - ${REDIS_MAXMEMORY:-96mb}
      - --maxmemory-policy
      - noeviction
    volumes: !override
      - redis_data_prod:/data
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    networks: !override [backend-internal]
    # 256 MB, not 128 MB. `maxmemory` bounds the DATASET only - it excludes
    # client buffers and the copy-on-write pages of the fork() an AOF rewrite
    # performs. Setting maxmemory equal to the cgroup limit means the kernel
    # OOM-kills Redis before Redis can ever apply its own policy, and with
    # `noeviction` (required by BullMQ) that means lost job state.
    mem_limit: 256m
    mem_reservation: 96m
    cpus: 0.5
    pids_limit: 100

# ----------------------------------------------------------------------------
volumes:
  mongo_data_prod:
  mongo_config_prod:
  redis_data_prod:
  caddy_data:
  caddy_config:

networks:
  backend-internal:
    # No route to or from the outside world. Only backend, mongo and redis
    # attach to it.
    internal: true
