# ============================================================================
# nginx - static hosting for the TuberIA React SPA
# ============================================================================
# Runs inside nginxinc/nginx-unprivileged as uid 101, behind Caddy.
#
# Division of responsibility:
#   Caddy owns TLS, HSTS and the browser security headers (CSP,
#   Permissions-Policy, ...) because it is the only component that sees the
#   real client. nginx owns caching semantics and SPA routing.
#   Duplicating security headers here would emit each one twice.
# ============================================================================

server {
    # 8080, not 80: an unprivileged process cannot bind ports below 1024.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Caddy already terminates the connection and re-reads the body; keeping
    # nginx's own limit generous avoids a confusing second 413.
    client_max_body_size 10m;

    # Don't advertise the exact nginx version in Server: / error pages.
    server_tokens off;

    # ------------------------------------------------------------------------
    # Compression
    # ------------------------------------------------------------------------
    # Caddy compresses what it serves to the client, but this hop is still
    # worth compressing: it cuts the bytes copied over the container network
    # for the large JS bundle.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # ------------------------------------------------------------------------
    # Hashed build assets - safe to cache forever
    # ------------------------------------------------------------------------
    # Vite fingerprints these filenames (index-D8oGrjCu.js), so a new build
    # produces a new URL and `immutable` can never serve stale code.
    # As above: `expires` is omitted because it emits its own Cache-Control,
    # duplicating the explicit one. add_header alone is authoritative.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Static files outside /assets/ (favicons, og image, fonts). These are NOT
    # fingerprinted, so they get a shorter TTL and must revalidate.
    location ~* \.(?:png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------------
    # Never-cached entry points
    # ------------------------------------------------------------------------
    # index.html carries the <script src> pointing at the current hashed
    # bundle. If a browser caches it, the user is pinned to an old release.
    # NOTE: no `expires -1;` here. That directive emits its OWN
    # `Cache-Control: no-cache`, which arrives alongside the explicit
    # add_header below and sends the header twice.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------------
    # Well-known URIs (security.txt, etc.)
    # ------------------------------------------------------------------------
    location /.well-known/ {
        try_files $uri =404;
    }

    # ------------------------------------------------------------------------
    # Container health probe
    # ------------------------------------------------------------------------
    # Answered by nginx itself, so it stays green even if the bundle is missing
    # - which is what you want from a *liveness* probe. Compose additionally
    # probes "/" to catch an empty document root.
    location = /healthz {
        access_log off;
        # `default_type`, not `add_header Content-Type`. nginx already emits a
        # Content-Type for a `return`ed body (application/octet-stream), and
        # add_header APPENDS rather than replaces - the response carried two
        # conflicting Content-Type headers.
        default_type text/plain;
        return 200 "healthy\n";
    }

    # ------------------------------------------------------------------------
    # SPA fallback
    # ------------------------------------------------------------------------
    # React Router owns client-side routes; any unmatched path must return
    # index.html (200) rather than 404 so a deep link works on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;

        # NOTE ON add_header INHERITANCE (a classic nginx trap):
        # add_header directives are NOT merged across levels - a location block
        # that declares even one add_header discards every add_header from its
        # parent. That is why each location above repeats the headers it needs
        # instead of relying on a server-level block.
        #
        # Cache-Control is deliberately NOT set here. try_files resolves to
        # /index.html via an internal redirect, so the `location = /index.html`
        # block above supplies it; setting it in both emitted the header twice.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ------------------------------------------------------------------------
    # Error handling
    # ------------------------------------------------------------------------
    # Deliberately NO `error_page 404 /index.html`: the SPA fallback above
    # already returns index.html with a 200 for real routes. Adding it here
    # would also swallow genuine 404s for missing assets, so a stale bundle
    # reference would return an HTML page where JavaScript was expected -
    # producing "Unexpected token '<'" instead of a clean network error.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        root /usr/share/nginx/html;
    }
}
